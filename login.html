<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login | Docker-Machine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('https://images.unsplash.com/photo-1603791440384-56cd371ee9a7?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      animation: fadeIn 2s ease-in-out;
    }

    header {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px 0;
      text-align: center;
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    header img {
      width: 40px;
      height: 40px;
    }

    .login-container {
      margin: auto;
      background: rgba(20, 20, 20, 0.9);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      width: 90%;
      max-width: 400px;
      text-align: center;
      animation: slideUp 1.5s ease;
      color: #fff;
    }

    h2 {
      margin-bottom: 20px;
      color: #00bfff;
    }

    input {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
      background-color: #333;
      color: #fff;
    }

    input::placeholder {
      color: #bbb;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007BFF;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .error {
      color: #ff6b6b;
      margin-top: 10px;
    }

    footer {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-align: center;
      padding: 10px;
      font-size: 0.9rem;
      position: relative;
      bottom: 0;
      width: 100%;
    }

    @media (max-width: 500px) {
      header {
        font-size: 1.5rem;
      }

      .login-container {
        padding: 20px;
      }

      header img {
        width: 30px;
        height: 30px;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- CABECERA -->
  <header>
    <img src="https://img.icons8.com/ios-filled/50/ffffff/docker.png" alt="Docker Logo">
    Docker-Machine
  </header>

  <!-- LOGIN -->
  <div class="login-container">
    <h2>Iniciar sesión</h2>
    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="contrasena" placeholder="Contraseña">
    <button onclick="validarLogin()">Entrar</button>
    <div class="error" id="mensajeError"></div>
  </div>

  <!-- PIE DE PÁGINA -->
  <footer>
    &copy; 2025 Docker-Machine. Todos los derechos reservados.
  </footer>

  <!-- SCRIPT -->
  <script>
  const usuarios = {
    "admin": "1234",
    "alfonso": "openai123",
    "usuario2": "abcd",
    "demo": "demo"
  };

  function validarLogin() {
    const usuarioInput = document.getElementById("usuario");
    const contrasenaInput = document.getElementById("contrasena");
    const mensaje = document.getElementById("mensajeError");

    const usuario = usuarioInput.value.trim();
    const contrasena = contrasenaInput.value.trim();

    if (usuarios[usuario] && usuarios[usuario] === contrasena) {
      // Login correcto
      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("usuario", usuario);
      window.location.href = "index.html"; // Redirección
    } else {
      // Login incorrecto
      mensaje.textContent = "Usuario o contraseña incorrectos.";

      // Limpiar campos
      usuarioInput.value = "";
      contrasenaInput.value = "";
      usuarioInput.focus();

      // Cambiar mensaje tras 3 segundos
      setTimeout(() => {
        mensaje.textContent = "Introduce tus datos.";
      }, 3000);
    }
  }
</script>

</body>
</html>
